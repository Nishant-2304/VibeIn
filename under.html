<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 550px; text-align: center; }
        .icon { font-size: 3rem; margin-bottom: 20px; display: inline-block; }
        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 16px; color: #ffffff; }
        p { font-size: 1.15rem; color: #9ca3af; margin-bottom: 40px; line-height: 1.6; }
        .progress-bar { width: 100%; height: 8px; background: #1f2937; border-radius: 9999px; margin-bottom: 12px; overflow: hidden; }
        .progress-fill { width: 75%; height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 9999px; }
        .status-text { font-size: 0.875rem; color: #6b7280; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Under Construction</h1>
        <p>We are currently upgrading our servers and redesigning the layout to serve you better. We'll be back online shortly.</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="status-text">Estimated progress: 75% complete</div>
    </div>
</body>
</html>
